<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>HireVue & Willo AI Mock Interview Assessor</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 800px; margin: 2rem auto; padding: 0 1rem; line-height: 1.5; }
    label { font-weight: bold; display: block; margin-top: 1rem; }
    textarea, input, select { width: 100%; padding: 0.5rem; margin-top: 0.25rem; box-sizing: border-box; }
    button { margin-top: 1rem; padding: 0.75rem 1.5rem; background: #0066cc; color: white; border: none; border-radius: 4px; cursor: pointer; }
    button:disabled { background: #ccc; }
    .card { background: #f9f9f9; border: 1px solid #ddd; padding: 1rem; margin-top: 1rem; border-radius: 6px; }
    .score { font-size: 1.5rem; font-weight: bold; color: #0066cc; }
  </style>
</head>
<body>

  <h1>AI Interview Assessment Tool</h1>
  <p>Evaluate your practice responses against actual HireVue and Willo scoring criteria.</p>

  <label for="apiKey">Gemini API Key (Stored locally in browser):</label>
  <input type="password" id="apiKey" placeholder="AIzaSy..." />

  <label for="company">Target Company & Core Values:</label>
  <input type="text" id="company" placeholder="e.g., Amazon (Customer Obsession, Ownership, Bias for Action)" />

  <label for="question">Interview Question:</label>
  <textarea id="question" rows="2" placeholder="e.g., Tell me about a time you had to handle a tight deadline with incomplete information."></textarea>

  <label for="response">Your Response (Type or paste transcript):</label>
  <textarea id="response" rows="6" placeholder="Paste your practice answer here..."></textarea>

  <button id="evalBtn" onclick="evaluateResponse()">Analyze Interview Answer</button>

  <div id="results"></div>

  <script src="app.js"></script>
</body>
</html>
